name: Deploy to GitHub Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 构建 NetV.js 库
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - run: npm install
      - run: npm run build:netv
        env:
          NODE_OPTIONS: --openssl-legacy-provider
      - run: cd packages/netv && npm run build:benchmarks
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      # 构建 VuePress 文档站
      - uses: actions/checkout@v4
        with:
          ref: docs
          path: docs-branch

      - name: Build docs site
        working-directory: docs-branch
        run: |
          npm install
          # 修改 VuePress base 路径以适配 GitHub Pages 子路径部署
          sed -i "s|base: '/'|base: '/NetV.js/'|" src/.vuepress/config.js
          npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Prepare site
        run: |
          mkdir -p _site
          # 复制 VuePress 文档站构建产物
          cp -r docs-branch/docs/* _site/
          # 复制 benchmarks 演示页面
          mkdir -p _site/benchmarks
          cp packages/netv/benchmarks/index.html _site/benchmarks/
          cp packages/netv/benchmarks/bundle.js _site/benchmarks/
          # 复制构建产物
          mkdir -p _site/build
          cp packages/netv/build/NetV.js _site/build/
          cp packages/netv/build/NetV.min.js _site/build/
          cp packages/netv/build/NetV.js.map _site/build/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
