name: Deploy to GitHub Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - run: npm ci
      - run: npm run build
        env:
          NODE_OPTIONS: --openssl-legacy-provider
      - run: cd packages/netv && npm run build:benchmarks
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Prepare site
        run: |
          mkdir -p _site
          # 复制 benchmarks 演示页面
          cp packages/netv/benchmarks/index.html _site/
          cp packages/netv/bundle.js _site/
          # 复制构建产物
          mkdir -p _site/build
          cp packages/netv/build/NetV.js _site/build/
          cp packages/netv/build/NetV.min.js _site/build/
          cp packages/netv/build/NetV.js.map _site/build/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
