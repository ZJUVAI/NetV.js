name: Deploy to GitHub Pages

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 构建 NetV.js 库
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - run: npm install
      - run: npm run build:netv
        env:
          NODE_OPTIONS: --openssl-legacy-provider
      - run: cd packages/netv && npm run build:benchmarks
        env:
          NODE_OPTIONS: --openssl-legacy-provider

      # 拉取 docs 分支的预构建文档站
      - uses: actions/checkout@v4
        with:
          ref: docs
          path: docs-branch

      - name: Fix asset paths for /NetV.js/ subpath
        run: |
          # 将所有绝对路径 /xxx 重写为 /NetV.js/xxx
          find docs-branch/docs -name "*.html" -exec sed -i \
            -e 's|href="/|href="/NetV.js/|g' \
            -e 's|src="/|src="/NetV.js/|g' \
            {} \;

      - name: Prepare site
        run: |
          mkdir -p _site
          # 复制文档站（已修正路径）
          cp -r docs-branch/docs/* _site/
          # 复制 benchmarks 演示页面
          mkdir -p _site/benchmarks
          cp packages/netv/benchmarks/index.html _site/benchmarks/
          cp packages/netv/benchmarks/bundle.js _site/benchmarks/
          # 复制构建产物
          mkdir -p _site/build
          cp packages/netv/build/NetV.js _site/build/
          cp packages/netv/build/NetV.min.js _site/build/
          cp packages/netv/build/NetV.js.map _site/build/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
